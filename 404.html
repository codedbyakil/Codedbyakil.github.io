<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found | Akil Portfolio</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="canonical" href="https://codedbyakil.github.io/portfolio/404.html" />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Space+Grotesk:wght@500;700&display=swap" />
  <style>
    :root {
      color-scheme: dark;
      --bg: #09090b;
      --text: #f8fafc;
      --muted: #cbd5e1;
      --accent: #60a5fa;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, sans-serif;
      background: radial-gradient(circle at top, rgba(59,130,246,0.16), transparent 30%), var(--bg);
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .card {
      max-width: 720px;
      width: 100%;
      border-radius: 24px;
      padding: 32px;
      background: rgba(15,23,42,0.82);
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 24px 60px rgba(15,23,42,0.28);
      text-align: center;
    }
    h1 {
      font-family: "Space Grotesk", sans-serif;
      font-size: clamp(2rem, 3vw, 2.8rem);
      margin: 0 0 12px;
    }
    p { color: var(--muted); line-height: 1.7; }
    a {
      color: #fff;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 16px;
      padding: 12px 18px;
      border-radius: 9999px;
      background: linear-gradient(90deg, #3b82f6, #8b5cf6);
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main class="card">
    <p style="text-transform:uppercase; letter-spacing:.2em; color:#93c5fd; font-size:0.8rem; margin-bottom: 12px;">404</p>
    <h1>Page not found</h1>
    <p>The page you’re looking for doesn’t exist or may have moved. Return to the home page to explore Akil’s Android, IPTV, and web portfolio.</p>
    <a href="/portfolio/">← Back to home</a>
  </main>
</body>
</html>
